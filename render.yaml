services:
  - type: web
    name: nutritech-dashboard
    runtime: python
    buildCommand: |
      # 1. Install Backend Dependencies
      pip install -r backend/requirements.txt
      # 2. Build Frontend (Baked-in env vars needed here!)
      cd frontend/nutritech-dashboard && npm install && npm run build
    startCommand: gunicorn --chdir backend --bind 0.0.0.0:$PORT "app:create_app()"
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false